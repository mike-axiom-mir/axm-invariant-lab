name: invariant-lab-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and refinement tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic evidence check
        run: python tools/run_evidence.py --check
      - name: Cross-implementation evidence check
        run: python tools/run_cross_verification.py --check
      - name: Monolith refinement evidence check
        run: python tools/run_monolith_refinement.py --check
      - name: Tractability evidence check
        run: python tools/run_tractability.py --check
      - name: External consumer compatibility check
        run: python tools/check_external_consumers.py --check
      - name: State Research Sentinel execution refinement check
        run: python tools/run_state_research_sentinel_refinement.py --check
