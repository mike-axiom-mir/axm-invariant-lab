name: invariant-lab-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and refinement tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic evidence check
        run: python tools/run_evidence.py --check
      - name: Cross-implementation evidence check
        run: python tools/run_cross_verification.py --check
      - name: Monolith refinement evidence check
        run: python tools/run_monolith_refinement.py --check
      - name: Connected Monolith INV-20 callability refinement evidence check
        run: python tools/run_monolith_connected_zip_refinement.py --check
      - name: Connected Monolith INV-20 archive-backed refinement evidence check
        run: python tools/run_monolith_connected_archive_refinement.py --check
      - name: Tractability evidence check
        run: python tools/run_tractability.py --check
      - name: External consumer compatibility check
        run: python tools/check_external_consumers.py --check
      - name: State Research Sentinel execution refinement check
        run: python tools/run_state_research_sentinel_refinement.py --check
      - name: State Research Wakeup Fuzzer runtime-observation refinement check
        run: python tools/run_state_research_wakeup_fuzzer_refinement.py --check
      - name: State Research real-project held-out closure refinement check
        run: python tools/run_state_research_real_project_closure_refinement.py --check
      - name: State Research unlabeled multi-project closure refinement check
        run: python tools/run_state_research_unlabeled_multiproject_closure_refinement.py --check
      - name: State Research cross-version opaque recovery refinement check
        run: python tools/run_state_research_opaque_recovery_refinement.py --check
      - name: State Research Stateborn fresh-process checkpoint refinement check
        run: python tools/run_state_research_stateborn_checkpoint_refinement.py --check
      - name: State Research Stateborn hostile-transport refinement check
        run: python tools/run_state_research_stateborn_transport_refinement.py --check
      - name: State Research reference-state closure refinement check
        run: python tools/run_state_research_reference_state_closure_refinement.py --check
      - name: TruthGrid client-intent INV-06 refinement evidence check
        run: python tools/run_truthgrid_client_intent_refinement.py --check
      - name: Universal Creation donor-fidelity INV-10 refinement evidence check
        run: python tools/run_universal_creation_donor_fidelity.py --check
      - name: Checkout pinned Universal Creation donor execution
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: b6e77afca5dce48f42c41e73af3ec2f7709d6a6d
          path: .verification/axm-universal-creation
      - name: Universal Creation donor-owned INV-10 execution check
        run: python tools/run_universal_creation_donor_execution.py --check --donor-root .verification/axm-universal-creation
      - name: Machine discovery integrity check
        run: python tools/check_discovery_contract.py --check
      - name: Public discovery projection check
        run: python tools/check_public_discovery.py --check
      - name: Checkout pinned Discovery Buddy consumer
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-discovery-buddy
          ref: a1e28aba31c453023298e01ce4e54107c3f74583
          path: .verification/axm-discovery-buddy
      - name: Discovery Buddy cross-repository compatibility check
        run: python tools/check_discovery_buddy_consumer.py --check --buddy-root .verification/axm-discovery-buddy
      - name: Install pinned formal comparison dependency
        run: python -m pip install -r requirements-formal.txt
      - name: Z3 INV-01 formal comparison tests
        run: python -m unittest formal_tests.test_z3_inv01 -v
      - name: Z3 INV-01 formal comparison evidence check
        run: python tools/run_z3_inv01_comparison.py --check
      - name: Z3 INV-03 formal comparison tests
        run: python -m unittest formal_tests.test_z3_inv03 -v
      - name: Z3 INV-03 formal comparison evidence check
        run: python tools/run_z3_inv03_comparison.py --check
